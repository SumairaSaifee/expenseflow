apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backendService.name }}
  labels:
    app: {{ .Values.backend.label }}
spec:
  selector:
    app: {{ .Values.backend.label }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}