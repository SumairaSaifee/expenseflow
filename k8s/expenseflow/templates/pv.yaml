{{- if .Values.pv.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.pv.name }}

spec:
  capacity:
    storage: {{ .Values.pv.storage }}

  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.storageClassName }}

  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /mnt/data

{{- end }}